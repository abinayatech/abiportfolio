    <!--
      GitHub Pages SPA fallback support.
      GitHub Pages has no server-side rewrite rules, so a hard refresh or
      direct link to a nested route (e.g. /projects/healvent) returns the
      static 404.html file instead of index.html. public/404.html stores
      the attempted path in sessionStorage and redirects to "/"; this
      script then restores the original path via the History API before
      the router mounts, so TanStack Router renders the right route.
    -->
    <script>
      (function () {
        var redirect = sessionStorage.getItem("spa-redirect-path");
        if (redirect) {
          sessionStorage.removeItem("spa-redirect-path");
          if (redirect !== location.pathname + location.search + location.hash) {
            history.replaceState(null, "", redirect);
          }
        }
      })();
    </script>
